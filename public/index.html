<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bots AI 对话</title>
    <!-- jQuery -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ==================== 顶部标题栏 ==================== -->
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <div class="header__logo">
                    <span class="header__emoji">🤖</span>
                    <h1 class="header__title">Bots AI 对话</h1>
                </div>
                <p class="header__subtitle">流式对话</p>
                <!-- US-4.8: 顶部菜单（会话 / 历史 / 状态） -->
                <nav class="top-menu" id="top-menu">
                    <button class="top-menu__item top-menu__item--active" data-view="chat">会话</button>
                    <button class="top-menu__item" data-view="history">历史</button>
                    <button class="top-menu__item" data-view="status">状态</button>
                </nav>
            </div>
        </div>
    </header>

    <!-- ==================== 聊天视图（US-4.8） ==================== -->
    <main class="chat-layout" id="view-chat">
        <!-- 消息列表 -->
        <div class="chat-messages" id="chat-messages">
            <!-- 空状态 -->
            <div class="chat-empty" id="chat-empty">
                <div class="chat-empty__icon">🍳</div>
                <div class="chat-empty__title">开始对话</div>
                <div class="chat-empty__desc">
                    在下方输入你的问题，AI 助手会实时流式回复。<br>
                    支持代码块、Markdown 格式。
                </div>
            </div>
        </div>

        <!-- 状态提示 -->
        <div class="chat-status" id="chat-status"></div>

        <!-- 会话汇总栏（R3.3：会话累计统计，位于输入框上方） -->
        <div class="chat-usage" id="chat-usage"></div>

        <!-- 输入区域 -->
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea class="chat-input" id="chat-input" rows="1"
                    placeholder="输入你的问题，按 Enter 发送，Shift+Enter 换行..."
                    disabled></textarea>
                <button class="chat-send-btn" id="chat-send-btn" disabled>
                    发送
                </button>
                <button class="chat-stop-btn" id="chat-stop-btn" hidden>
                    停止
                </button>
            </div>
        </div>
    </main>

    <!-- ==================== 历史视图（US-4.8） ==================== -->
    <section class="history-layout" id="view-history" hidden>
        <div class="history-header">
            <h2 class="history-header__title">历史会话</h2>
            <button class="history-new-btn" id="history-new-btn">＋ 新建会话</button>
        </div>
        <ul class="history-list" id="history-list"></ul>
        <div class="history-empty" id="history-empty" hidden>
            <div class="history-empty__icon">📭</div>
            <div class="history-empty__title">暂无历史会话</div>
            <div class="history-empty__desc">开始一段新对话后，会话会出现在这里。</div>
        </div>
    </section>

    <!-- ==================== 状态视图（US-4.8，iframe 复用既有状态页） ==================== -->
    <section class="status-view" id="view-status" hidden>
        <iframe class="status-view__frame" src="status.html" title="系统状态"></iframe>
    </section>

    <!-- ==================== 底部页脚 ==================== -->
    <footer class="footer">
        <div class="container">
            <p class="footer__text">
                Bots AI Chat &copy; 2024 &middot;
                Powered by Bun + Hono + AI SDK
            </p>
        </div>
    </footer>

    <!-- 聊天页面 JS -->
    <script src="js/chat.js"></script>
</body>

</html>
